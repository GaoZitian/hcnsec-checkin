name: hcnsec daily check-in

on:
  schedule:
    # 每天北京时间 09:10（UTC 01:10）
    - cron: '10 1 * * *'
  workflow_dispatch:

jobs:
  checkin:
    name: Sign in
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HCNSEC_USERNAME: ${{ secrets.HCNSEC_USERNAME }}
      HCNSEC_PASSWORD: ${{ secrets.HCNSEC_PASSWORD }}
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 1. 安装 Node.js
      # ---------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------------------------------------------------
      # 2. 安装项目依赖并安装 Playwright 浏览器
      # ---------------------------------------------------------
      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps

      # ---------------------------------------------------------
      # 5. 运行签到脚本
      # ---------------------------------------------------------
      - name: Run hcnsec check-in
        run: node checkin.js