name: hcnsec daily check-in

on:
  schedule:
    # 每天北京时间 09:10（UTC 01:10）
    - cron: '10 1 * * *'
  workflow_dispatch:

jobs:
  checkin:
    name: Sign in
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 使用账号密码登录（Playwright 自动化）
      HCNSEC_USERNAME: ${{ secrets.HCNSEC_USERNAME }}
      HCNSEC_PASSWORD: ${{ secrets.HCNSEC_PASSWORD }}
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 1. 安装 Node.js
      # ---------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ---------------------------------------------------------
      # 2. 安装依赖
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # 3. 安装 Playwright 浏览器
      # ---------------------------------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ---------------------------------------------------------
      # 4. 运行签到
      # ---------------------------------------------------------
      - name: Run hcnsec check-in
        run: node checkin.js
