name: hcnsec daily check-in

on:
  schedule:
    # 每天北京时间 09:10（UTC 01:10）
    - cron: '10 1 * * *'
  workflow_dispatch:

jobs:
  checkin:
    name: Sign in
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 纯 HTTP 签到，使用个人访问令牌（Bearer token，不绑 IP）
      HCNSEC_API_TOKEN: ${{ secrets.HCNSEC_API_TOKEN }}
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 1. 安装 Node.js（>= 18 自带 fetch，无需 npm install）
      # ---------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------------------------------------------------
      # 2. 运行签到（纯 HTTP，不启动浏览器）
      # ---------------------------------------------------------
      - name: Run hcnsec check-in
        run: node checkin.js
