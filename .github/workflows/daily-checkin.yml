name: HCNSec Daily Check-in

on:
  schedule:
    # 每天北京时间 09:10（UTC 01:10）
    - cron: '10 1 * * *'
  workflow_dispatch:

jobs:
  checkin:
    name: Sign in
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HCNSEC_USERNAME: ${{ secrets.HCNSEC_USERNAME }}
      HCNSEC_PASSWORD: ${{ secrets.HCNSEC_PASSWORD }}
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 1. 安装 Node.js
      # ---------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------------------------------------------------------
      # 3. 安装项目依赖
      # ---------------------------------------------------------
      - name: Install dependencies
        run: npm ci
        # 注意：首次运行 npm ci 会自动安装 playwright 二进制;
        # 之后缓存将复用，速度极快。

      # ---------------------------------------------------------
      # 4. 运行 playwright 安装并运行脚本
      # ---------------------------------------------------------
      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps

      # ---------------------------------------------------------
      # 5. 运行签到脚本
      # ---------------------------------------------------------
      - name: Run hcnsec check-in
        run: node checkin.js